<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR - Daftar Hadir</title>

  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================================================
       BACKGROUND
       GANTI FILE "background.jpg" UNTUK MENGUBAH GAMBAR LATAR
       ========================================================= */
        body {
         background:
         linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)),
         url("https://i.ibb.co.com/xq7dyWQm/Whats-App-Image-2025-12-16-at-08-33-32.jpg") center center / cover no-repeat fixed;
        }
    }

    /* =========================================================
       JIKA INGIN VIDEO BACKGROUND:
       tambahkan <video id="bgVideo"...> di HTML seperti contoh
       yang sudah disediakan di bawah.
       ========================================================= */
    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      z-index: -1;
    }

    .page {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      color: white;
      text-align: center;
    }

    .title {
      margin-bottom: 14px;
      text-shadow: 0 3px 12px rgba(0,0,0,.55);
    }

    .title .icon {
      font-size: 30px;
      margin-bottom: 4px;
    }

    .title h1 {
      font-size: clamp(22px, 2.5vw, 34px);
      font-weight: 700;
      letter-spacing: .3px;
    }

    .title p {
      margin-top: 5px;
      font-size: clamp(12px, 1.25vw, 16px);
    }

    /* Kotak kamera */
    .camera-wrap {
      position: relative;
      width: min(48vw, 420px);
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      overflow: hidden;
      background: rgba(8, 15, 25, .72);
      border: 3px solid rgba(255,255,255,.75);
      box-shadow:
        0 18px 60px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(255,255,255,.15);
      backdrop-filter: blur(4px);
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    /* Hilangkan beberapa elemen bawaan html5-qrcode */
    #reader__scan_region {
      width: 100% !important;
      min-height: 100% !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #reader img[alt="Info icon"] {
      display: none !important;
    }

    /* Bingkai scan */
    .scan-frame {
      position: absolute;
      inset: 10%;
      pointer-events: none;
      border-radius: 14px;
    }

    .corner {
      position: absolute;
      width: 55px;
      height: 55px;
      border-color: #1597ff;
      border-style: solid;
      filter: drop-shadow(0 0 5px rgba(21,151,255,.8));
    }

    .tl {
      top: 0;
      left: 0;
      border-width: 5px 0 0 5px;
      border-radius: 12px 0 0 0;
    }

    .tr {
      top: 0;
      right: 0;
      border-width: 5px 5px 0 0;
      border-radius: 0 12px 0 0;
    }

    .bl {
      bottom: 0;
      left: 0;
      border-width: 0 0 5px 5px;
      border-radius: 0 0 0 12px;
    }

    .br {
      bottom: 0;
      right: 0;
      border-width: 0 5px 5px 0;
      border-radius: 0 0 12px 0;
    }

    .scan-line {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 10%;
      height: 3px;
      background: #1597ff;
      box-shadow: 0 0 14px #1597ff;
      animation: scan 2.2s linear infinite;
    }

    @keyframes scan {
      0%   { top: 10%; opacity: .35; }
      50%  { opacity: 1; }
      100% { top: 90%; opacity: .35; }
    }

    .camera-status {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(0,0,0,.60);
      color: white;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
    }

    .instruction {
      margin-top: 14px;
      padding: 9px 17px;
      border-radius: 999px;
      background: rgba(20, 105, 230, .88);
      box-shadow: 0 8px 25px rgba(0,0,0,.28);
      font-size: clamp(11px, 1.1vw, 14px);
    }

    #result {
      margin-top: 12px;
      min-height: 24px;
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
    }

    @media (max-width: 600px) {
      .page {
        padding: 14px;
      }

      .title {
        margin-bottom: 14px;
      }

      .title .icon {
        font-size: 34px;
      }

      .camera-wrap {
        width: min(78vw, 340px);
        aspect-ratio: 1 / 1;
      }

      .scan-frame {
        inset: 9%;
      }

      .corner {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>

<body>



  <!--
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>
  -->

  <main class="page">

    <div class="title">
      <div class="icon">▣</div>
      <h1>Scan QR / Barcode</h1>
      <p>Arahkan kamera ke QR Code atau Barcode</p>
    </div>

    <div class="camera-wrap">

      <div id="reader"></div>

      <!-- Bingkai scanner -->
      <div class="scan-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line"></div>
      </div>

      <div class="camera-status" id="cameraStatus">
        Memulai kamera...
      </div>

    </div>

    <div class="instruction">
      ℹ️ Pastikan QR Code / Barcode berada di dalam bingkai
    </div>

    <div id="result"></div>

  </main>

  <script>
    let scanner;

    function onScanSuccess(decodedText) {
      document.getElementById("result").textContent =
        "QR terbaca: " + decodedText;

      // =====================================================
      // MASUKKAN PROSES SETELAH QR TERBACA DI SINI.
      // Contoh:
      // window.location.href = decodedText;
      // =====================================================
    }

    function onScanFailure(error) {
      // Sengaja dikosongkan.
      // Scanner akan terus mencari QR/Barcode.
    }

    async function startScanner() {
      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
              const size = Math.min(
                viewfinderWidth * 0.72,
                viewfinderHeight * 0.72
              );
              return {
                width: Math.floor(size),
                height: Math.floor(size)
              };
            },
            aspectRatio: 1.45,
            formatsToSupport: [
              Html5QrcodeSupportedFormats.QR_CODE,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8
            ]
          },
          onScanSuccess,
          onScanFailure
        );

        document.getElementById("cameraStatus").textContent =
          "Kamera siap digunakan";

      } catch (error) {
        console.error(error);

        document.getElementById("cameraStatus").textContent =
          "Kamera tidak dapat digunakan";

        document.getElementById("result").textContent =
          "Izinkan akses kamera, lalu buka halaman melalui HTTPS atau localhost.";
      }
    }

    window.addEventListener("load", startScanner);
  </script>

</body>
</html>
